name: firmware

on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

jobs:
  uvc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [left, right, back, face]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.role }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          path: firmware/esp32s3_uvc_cam
          command: >-
            idf.py -B build_${{ matrix.role }}
            -D SDKCONFIG=build_${{ matrix.role }}/sdkconfig
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.role.${{ matrix.role }}"
            build &&
            cd build_${{ matrix.role }} &&
            esptool.py --chip esp32s3 merge_bin -o ../aero-${{ matrix.role }}.bin @flash_args
      - name: Serial string really is the role
        run: |
          ROLE=$(echo "${{ matrix.role }}" | tr a-z A-Z)
          grep -q "\"AERO-$ROLE\"" firmware/esp32s3_uvc_cam/build_${{ matrix.role }}/config/sdkconfig.h
      - name: Bulk transfer mode is set (shares bandwidth across boards)
        run: |
          grep -q "CONFIG_UVC_MODE_BULK_CAM1 1" firmware/esp32s3_uvc_cam/build_${{ matrix.role }}/config/sdkconfig.h
      - uses: actions/upload-artifact@v4
        with:
          name: aero-uvc-${{ matrix.role }}
          path: firmware/esp32s3_uvc_cam/aero-${{ matrix.role }}.bin

  bundle:
    needs: uvc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "aero-uvc-*", merge-multiple: true, path: bins }
      - uses: actions/upload-artifact@v4
        with: { name: aero-uvc-bins, path: bins/*.bin }

  # Same four roles with sdkconfig.psram_safe layered on top, for boards whose
  # PSRAM hangs boot at 80 MHz. Artifact names must not start with "aero-uvc-"
  # or the bundle job above sweeps them into aero-uvc-bins.
  uvc_psram_safe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [left, right, back, face]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.role }} (PSRAM 40 MHz, no memtest)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          path: firmware/esp32s3_uvc_cam
          command: >-
            idf.py -B build_safe_${{ matrix.role }}
            -D SDKCONFIG=build_safe_${{ matrix.role }}/sdkconfig
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.role.${{ matrix.role }};sdkconfig.psram_safe"
            build &&
            cd build_safe_${{ matrix.role }} &&
            esptool.py --chip esp32s3 merge_bin -o ../aero-${{ matrix.role }}-psram-safe.bin @flash_args
      - name: Role and PSRAM settings really took
        run: |
          H=firmware/esp32s3_uvc_cam/build_safe_${{ matrix.role }}/config/sdkconfig.h
          ROLE=$(echo "${{ matrix.role }}" | tr a-z A-Z)
          grep -q "\"AERO-$ROLE\"" $H
          grep -q "CONFIG_UVC_MODE_BULK_CAM1 1" $H
          grep -q "CONFIG_SPIRAM_SPEED 40" $H
          ! grep -q "CONFIG_SPIRAM_MEMTEST 1" $H
      - uses: actions/upload-artifact@v4
        with:
          name: psram-safe-uvc-${{ matrix.role }}
          path: firmware/esp32s3_uvc_cam/aero-${{ matrix.role }}-psram-safe.bin

  bundle_psram_safe:
    needs: uvc_psram_safe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "psram-safe-uvc-*", merge-multiple: true, path: bins }
      - uses: actions/upload-artifact@v4
        with: { name: psram-safe-uvc-bins, path: bins/*.bin }

  servo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          sketch-paths: firmware/servo_aim
          fqbn: arduino:avr:nano
          libraries: |
            - name: Servo
