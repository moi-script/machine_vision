<!doctype html>
<meta charset="utf-8">
<title>Live cameras — AeroSense</title>
<style>
  :root { --bg:#14161a; --panel:#1c1f26; --line:#2a2f3a; --ink:#e8ebf0;
          --dim:#99a1b3; --accent:#5b9dff; --ok:#35c46a; --bad:#ff5c5c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
  header { padding:13px 20px; border-bottom:1px solid var(--line);
           display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  .sub { color:var(--dim); font-size:12.5px; }
  header .spacer { flex:1; }
  a.nav { color:var(--accent); text-decoration:none; font-size:13px; }
  main { padding:16px 20px 40px; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap;
         background:var(--panel); border:1px solid var(--line); border-radius:9px;
         padding:11px 13px; margin-bottom:16px; }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(2, minmax(0,1fr)); }
  @media (max-width:900px){ .grid { grid-template-columns:1fr; } }
  .cam { background:var(--panel); border:1px solid var(--line); border-radius:10px;
         overflow:hidden; display:flex; flex-direction:column; }
  .cam h2 { margin:0; padding:10px 13px; font-size:13px; font-weight:600;
            border-bottom:1px solid var(--line); display:flex; gap:9px;
            align-items:center; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); }
  .dot.on { background:var(--ok); }
  .dot.err { background:var(--bad); }
  .view { background:#000; aspect-ratio:16/9; display:flex;
          align-items:center; justify-content:center; }
  .view img { width:100%; height:100%; object-fit:contain; display:block; }
  .view .idle { color:var(--dim); font-size:13px; }
  .ctl { padding:11px 13px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .meta { padding:0 13px 11px; color:var(--dim); font-size:12px;
          display:flex; gap:14px; flex-wrap:wrap; }
  .meta b { color:var(--ink); font-weight:600; }
  select, button, input[type=file] { font:inherit; }
  select { background:#232833; color:var(--ink); border:1px solid var(--line);
           border-radius:7px; padding:6px 8px; max-width:210px; }
  button { padding:6px 12px; border-radius:7px; border:1px solid var(--line);
           background:#232833; color:var(--ink); cursor:pointer; }
  button:hover:not(:disabled){ border-color:var(--accent); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.primary { background:var(--accent); border-color:var(--accent);
                   color:#08101f; font-weight:600; }
  .msg { margin-left:auto; font-size:12.5px; color:var(--dim); }
  .msg.bad { color:#ffb3b3; }
</style>

<header>
  <h1>Live cameras</h1>
  <span class="sub">Two slots run at once. Each picks its own source and model.</span>
  <span class="spacer"></span>
  <a class="nav" href="/calibration">→ calibration</a>
</header>

<main>
  <div class="bar">
    <label class="sub">Upload a video</label>
    <input type="file" id="up" accept="video/mp4,video/x-msvideo,video/quicktime,.mkv">
    <button id="upbtn">Upload</button>
    <button id="probe">Detect USB cameras</button>
    <button id="stopall">Stop all</button>
    <span class="msg" id="msg"></span>
  </div>
  <div class="grid" id="grid"></div>
</main>

<script>
const SLOTS = ["front", "left"];          // two now; add "right","back" for four
let sources = null, models = [], devices = [];
const $ = id => document.getElementById(id);

function say(t, bad) { const m = $("msg"); m.textContent = t || ""; m.className = "msg" + (bad ? " bad" : ""); }

async function api(path, opts) {
  const r = await fetch(path, opts);
  const b = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof b.detail === "string" ? b.detail : JSON.stringify(b.detail || b));
  return b;
}

async function refresh() {
  [sources, models] = await Promise.all([api("/api/sources"), api("/api/models")]);
  render();
}

function sourceOptions(cur) {
  const opt = (label, value, sel) =>
    `<option value='${value}' ${sel ? "selected" : ""}>${label}</option>`;
  let html = "";
  if (devices.length) {
    html += "<optgroup label='cameras'>";
    devices.forEach(d => {
      const v = JSON.stringify({kind:"device", index:d.index});
      html += opt(`device ${d.index} (${d.width}x${d.height})`, v,
                  cur.kind === "device" && cur.index === d.index);
    });
    html += "</optgroup>";
  }
  const group = (name, items) => {
    if (!items.length) return "";
    let s = `<optgroup label='${name}'>`;
    items.forEach(f => {
      const v = JSON.stringify({kind:"file", path:f.path});
      s += opt(`${f.name} (${f.size_mb} MB)`, v,
               cur.kind === "file" && cur.path === f.path);
    });
    return s + "</optgroup>";
  };
  html += group("uploaded", sources.uploads);
  html += group("bundled", sources.bundled);
  return html;
}

function render() {
  $("grid").innerHTML = SLOTS.map(id => {
    const cur = sources.current[id] || {};
    return `<div class="cam" data-cam="${id}">
      <h2><span class="dot" id="dot-${id}"></span>${id}
        <span class="sub" style="font-weight:400">${cur.name || "—"}</span></h2>
      <div class="view" id="view-${id}"><span class="idle">stopped</span></div>
      <div class="ctl">
        <select id="src-${id}">${sourceOptions(cur)}</select>
        <select id="mdl-${id}">${models.map(m =>
          `<option value="${m.key}" ${m.available ? "" : "disabled"}>${m.label}${m.available ? "" : " (missing)"}</option>`).join("")}</select>
        <button id="go-${id}" class="primary">Start</button>
        <button id="halt-${id}">Stop</button>
      </div>
      <div class="meta" id="meta-${id}"><span>idle</span></div>
    </div>`;
  }).join("");

  SLOTS.forEach(id => {
    $(`src-${id}`).onchange = async e => {
      try {
        await api(`/api/cameras/${id}/source`, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: e.target.value });
        stopView(id);
        say(`${id} source set`);
        await refresh();
      } catch (err) { say(err.message, true); }
    };
    $(`go-${id}`).onclick = () => start(id);
    $(`halt-${id}`).onclick = () => stop(id);
  });
}

function stopView(id) {
  const v = $(`view-${id}`);
  if (v) v.innerHTML = "<span class='idle'>stopped</span>";
  const d = $(`dot-${id}`); if (d) d.className = "dot";
}

async function start(id) {
  try {
    const model = $(`mdl-${id}`).value;
    const st = await api(`/api/cameras/${id}/start`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({model, infer_every: 1, target_fps: 15})});
    if (st.error) { say(`${id}: ${st.error}`, true); $(`dot-${id}`).className = "dot err"; return; }
    // cache-bust so a restarted stream is not served from the old connection
    $(`view-${id}`).innerHTML =
      `<img src="/api/cameras/${id}/stream?t=${Date.now()}" alt="${id}">`;
    $(`dot-${id}`).className = "dot on";
    say(`${id} started (${model})`);
  } catch (err) { say(err.message, true); }
}

async function stop(id) {
  stopView(id);            // drop the <img> first so the stream connection closes
  try { await api(`/api/cameras/${id}/stop`, {method:"POST"}); } catch {}
  $(`meta-${id}`).innerHTML = "<span>idle</span>";
}

$("upbtn").onclick = async () => {
  const f = $("up").files[0];
  if (!f) { say("choose a file first", true); return; }
  say(`uploading ${f.name}…`);
  const fd = new FormData(); fd.append("file", f);
  try {
    const d = await api("/api/uploads", {method:"POST", body: fd});
    say(`uploaded ${d.name} — ${d.width}x${d.height}, ${d.frames} frames`);
    await refresh();
  } catch (err) { say("upload failed: " + err.message, true); }
};

$("probe").onclick = async () => {
  say("probing capture devices…");
  devices = await api("/api/devices?max_index=4");
  say(devices.length ? `found ${devices.length} camera(s)` : "no cameras found");
  render();
};

$("stopall").onclick = async () => { for (const id of SLOTS) await stop(id); };

setInterval(async () => {
  let stats = [];
  try { stats = await api("/api/pipeline"); } catch { return; }
  SLOTS.forEach(id => {
    const s = stats.find(x => x.camera_id === id);
    const el = $(`meta-${id}`); if (!el) return;
    if (!s || !s.running) { el.innerHTML = "<span>idle</span>"; return; }
    el.innerHTML = s.error
      ? `<span style="color:#ffb3b3">${s.error}</span>`
      : `<span>model <b>${s.model}</b></span><span>fps <b>${s.fps}</b></span>` +
        `<span>latency <b>${s.ms} ms</b></span><span>det <b>${s.detections}</b></span>` +
        `<span>frames <b>${s.frames}</b></span>`;
  });
}, 1000);

refresh();
</script>
